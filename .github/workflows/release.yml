name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, for example v0.4.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate release
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Validate tag and Cargo version
        id: release
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Release tag '$TAG' must use vMAJOR.MINOR.PATCH." && exit 1
          fi
          VERSION="${BASH_REMATCH[1]}"

          CARGO_VERSION=$(grep -A2 '\[workspace\.package\]' Cargo.toml \
            | grep '^version' | sed 's/.*"\(.*\)"/\1/')
          if [ -z "$CARGO_VERSION" ]; then
            echo "::error::Could not read workspace.package.version from Cargo.toml." && exit 1
          fi
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag '$VERSION' != Cargo version '$CARGO_VERSION'." && exit 1
          fi

          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: Linux ${{ matrix.arch }}
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.tag }}

      # ubuntu-22.04 glibc 2.35 — widest compatible baseline for modern Linux distros.
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang \
            mold \
            pkg-config \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libsqlite3-dev \
            libssl-dev \
            libx11-xcb-dev \
            libxcb-dri2-0-dev \
            libxcb-dri3-dev \
            libxcb-icccm4-dev \
            libxcb-present-dev \
            libxcb-randr0-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-shm0-dev \
            libxcb-xfixes0-dev \
            libxcb-xkb-dev \
            libxcb1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Restore compiled artifacts — keyed on Cargo.lock so a dependency bump
      # always triggers a full rebuild.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          cache-on-failure: false

      # fat LTO + codegen-units=1 are already set in [profile.release].
      # CARGO_BUILD_JOBS=4 uses the runner's full 4-core capacity; the local
      # .cargo/config.toml caps at 2 to spare RAM on the dev machine.
      - name: Build Castle
        env:
          CARGO_BUILD_JOBS: "4"
        run: |
          cargo build --locked --release \
            --package app --bin castle \
            --target ${{ matrix.target }}

      - name: Report binary size
        run: |
          BINARY="target/${{ matrix.target }}/release/castle"
          SIZE=$(du -sh "$BINARY" | cut -f1)
          echo "Binary size: $SIZE"
          ls -lh "$BINARY"

      - name: Package
        run: |
          VERSION="${{ needs.metadata.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          BINARY="target/${{ matrix.target }}/release/castle"
          mkdir -p dist/package

          cp "$BINARY" dist/package/castle
          cp crates/app/assets/castle.desktop dist/package/castle.desktop
          cp crates/app/assets/icon/castle-app-icon.png dist/package/castle.png

          tar -czf "dist/Castle-$VERSION-linux-$ARCH.tar.gz" -C dist/package castle castle.desktop castle.png
          rm -rf dist/package
          cp install.sh dist/install.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Castle-${{ needs.metadata.outputs.version }}-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [metadata, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Castle-*
          path: release
          merge-multiple: true

      - name: Create checksums
        run: |
          cd release
          sha256sum Castle-*.tar.gz | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ needs.metadata.outputs.tag }}"
          mapfile -t ASSETS < <(find release -type f | sort)

          if gh release view "$TAG" &>/dev/null; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --verify-tag \
              --generate-notes \
              --title "Castle $TAG"
          fi
